# The app push server (push/, a Cloudflare Worker): tests on every pull request
# and push that touches it; deploys on main.
#
# test    unit tests (no network), the generated country names, wrangler deploy --dry-run.
# deploy  main only, and only when the CLOUDFLARE_API_TOKEN secret is set; otherwise
#         it skips with a notice. push/deploy.sh finds or creates the D1 database,
#         applies the migrations and deploys. The Worker's own secrets (APNs key,
#         FCM service account) are set once by scripts/setup-push-secrets.sh and
#         never pass through this workflow.
#
# Secrets (names only; values are set by scripts/setup-push-secrets.sh):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: Push server

on:
  push:
    branches: [main]
    paths: ["push/**", "NordicCrypto/Localizable.xcstrings", ".github/workflows/push.yml"]
  pull_request:
    paths: ["push/**", "NordicCrypto/Localizable.xcstrings", ".github/workflows/push.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-server-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: push

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: push/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Country names match the app's string catalogue
        run: npm run check-copy
      - name: wrangler deploy --dry-run
        run: npx --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/push-dist"

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'jQrgen/nordic-crypto-tv'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check for the Cloudflare token
        id: check
        working-directory: .
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = true ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Push server not deployed::CLOUDFLARE_API_TOKEN is not set. Run scripts/setup-push-secrets.sh once (docs/push.md)."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.check.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: push/package-lock.json
      - name: Deploy
        if: steps.check.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          npm ci --no-audit --no-fund
          ./deploy.sh
