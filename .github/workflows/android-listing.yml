name: Google Play store listing

# Uploads the Google Play store listing (texts, icon, feature graphic, TV banner and screenshots)
# from android/fastlane/metadata/android/ whenever it changes on main, or when run by hand.
# Category, privacy policy, Data safety, content rating and ads are set once in Play Console.

on:
  push:
    branches: [main]
    paths: ["android/fastlane/metadata/**", ".github/workflows/android-listing.yml"]
  workflow_dispatch:
    inputs:
      validate_only:
        description: Only validate the listing with Google Play, don't publish it
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: play-listing
  cancel-in-progress: false

jobs:
  listing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check for the Google Play key
        id: play
        working-directory: .
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set; skipping the store listing upload (see README)."
          fi

      - uses: actions/checkout@v4
        if: steps.play.outputs.enabled == 'true'

      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        if: steps.play.outputs.enabled == 'true'
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: android

      - name: Upload the store listing
        if: steps.play.outputs.enabled == 'true'
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VALIDATE_ONLY: ${{ inputs.validate_only || false }}
        run: |
          bundle exec fastlane supply \
            --package_name no.cryptonordic.app \
            --metadata_path fastlane/metadata/android \
            --skip_upload_apk true \
            --skip_upload_aab true \
            --skip_upload_changelogs true \
            --validate_only "$VALIDATE_ONLY"
