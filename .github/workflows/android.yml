name: Android APK and Play

on:
  push:
    branches: [main]
    paths: ["android/**", "NordicCrypto/Localizable.xcstrings", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=nordiccrypto\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties

      - name: Build APK and app bundle
        env:
          # Version code 1 was uploaded to Google Play by hand; CI codes start above
          # ANDROID_VERSION_CODE_OFFSET (default 100) so every upload is higher.
          RUN_NUMBER: ${{ github.run_number }}
          VERSION_CODE_OFFSET: ${{ vars.ANDROID_VERSION_CODE_OFFSET || '100' }}
          # Firebase client settings for push notifications (docs/push.md), set by
          # scripts/setup-push-secrets.sh. Empty: the app keeps the on-device check only.
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
        run: |
          export VERSION_CODE=$(( RUN_NUMBER + VERSION_CODE_OFFSET ))
          echo "versionCode $VERSION_CODE"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)" >> "$GITHUB_ENV"
          cp ../NordicCrypto/Localizable.xcstrings app/src/main/assets/Localizable.xcstrings
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/nordic-crypto.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/nordic-crypto.aab"

      - name: Keep the app bundle as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: nordic-crypto-aab-${{ github.run_number }}
          path: ${{ runner.temp }}/nordic-crypto.aab
          retention-days: 30

      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Latest Android build from ${GITHUB_SHA::7} (build ${{ github.run_number }}). Phone, tablet and Android TV. Allow installs from your browser, then open the APK."
          git tag -f android-latest "$GITHUB_SHA"
          git push -f origin refs/tags/android-latest
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --title "Android (latest build)" --notes "$notes" --prerelease --verify-tag
          gh release edit android-latest --notes "$notes"
          gh release upload android-latest "$RUNNER_TEMP/nordic-crypto.apk" "$RUNNER_TEMP/nordic-crypto.aab" --clobber

      - name: Check for the Google Play key
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set; skipping the Google Play upload (see README)."
          fi

      # Internal testing. While the app is still a draft in Play Console, Google only accepts
      # draft releases, so a failed completed release is retried as a draft.
      - name: Upload to Google Play internal testing
        id: upload
        if: steps.play.outputs.enabled == 'true'
        continue-on-error: true
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: no.cryptonordic.app
          releaseFiles: ${{ runner.temp }}/nordic-crypto.aab
          track: internal
          status: completed

      - name: Upload to Google Play internal testing (draft app)
        id: upload_draft
        if: steps.play.outputs.enabled == 'true' && steps.upload.outcome == 'failure'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: no.cryptonordic.app
          releaseFiles: ${{ runner.temp }}/nordic-crypto.aab
          track: internal
          status: draft

      # Open testing (public, Play's "beta" track): promotes the build that just reached internal
      # testing. Off until the repository variable PLAY_OPEN_TESTING is "true", because Play only
      # accepts it once the app's setup tasks are done and open testing is unlocked for the app.
      - name: Open testing is off
        if: steps.upload.outcome == 'success' && vars.PLAY_OPEN_TESTING != 'true'
        run: echo "::notice::Google Play open testing is off; set the repository variable PLAY_OPEN_TESTING to true to promote each build (see README)."

      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        if: steps.upload.outcome == 'success' && vars.PLAY_OPEN_TESTING == 'true'
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: android

      - name: Promote to Google Play open testing
        id: open_testing
        if: steps.upload.outcome == 'success' && vars.PLAY_OPEN_TESTING == 'true'
        continue-on-error: true
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          bundle exec fastlane supply \
            --package_name no.cryptonordic.app \
            --track internal \
            --track_promote_to beta \
            --track_promote_release_status completed \
            --version_code "$VERSION_CODE" \
            --skip_upload_apk true \
            --skip_upload_aab true \
            --skip_upload_metadata true \
            --skip_upload_changelogs true \
            --skip_upload_images true \
            --skip_upload_screenshots true

      - name: Open testing failed
        if: steps.open_testing.outcome == 'failure'
        run: echo "::warning::Promoting ${VERSION_NAME} (${VERSION_CODE}) to Google Play open testing failed (see the step above). The build stays in internal testing."

      # One GitHub release per build that reached Google Play: play-v<version>-<code>, with the
      # APK and the app bundle attached and the commit message as notes.
      - name: Create the GitHub release for this Google Play build
        if: steps.upload.outcome == 'success' || steps.upload_draft.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STATUS: ${{ steps.open_testing.outcome == 'success' && 'released to internal and open testing' || steps.upload.outcome == 'success' && 'released to internal testing' || 'uploaded as a draft release (the app is still a draft in Play Console)' }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          message=${COMMIT_MESSAGE:-$(git log -1 --format=%B)}
          tag="play-v${VERSION_NAME}-${VERSION_CODE}"
          {
            echo "Android ${VERSION_NAME} (version code ${VERSION_CODE}) was ${RELEASE_STATUS} on Google Play."
            echo
            echo "Phone, tablet and Android TV. The APK can also be installed directly."
            echo
            echo "Commit ${GITHUB_SHA::7}:"
            echo
            printf '%s\n' "$message"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$GITHUB_SHA" \
            --title "Google Play ${VERSION_NAME} (${VERSION_CODE})" --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP/nordic-crypto.apk#nordic-crypto-${VERSION_NAME}-${VERSION_CODE}.apk" \
            "$RUNNER_TEMP/nordic-crypto.aab#nordic-crypto-${VERSION_NAME}-${VERSION_CODE}.aab"
